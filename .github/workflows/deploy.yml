name: Deploy to Render (manual)

on:
  workflow_dispatch:

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render автоматически деплоит из GitHub при подключении репо через веб-интерфейс.
      # Этот workflow просто подтверждает, что код готов к деплою.
      - run: echo "📦 Code ready for Render deployment"
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}