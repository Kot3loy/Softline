services:
  - type: worker
    name: softline-bot
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      (test -x bin/ffmpeg ||
      (mkdir -p bin &&
      curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz |
      tar -xJ --strip-components=1 -C bin))
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GIGACHAT_CREDENTIALS
        sync: false
      - key: GIGACHAT_MODEL
        value: GigaChat-2
      - key: GIGACHAT_VERIFY_SSL_CERTS
        value: "true"
      - key: ADMIN_IDS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: data
      mountPath: /opt/render/project/src/database
      sizeGB: 1
