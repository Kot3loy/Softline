services:
  - type: web
    name: softline-bot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      pip install -r requirements.txt &&
      (test -x bin/ffmpeg ||
      (mkdir -p bin &&
      curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz |
      tar -xJ --strip-components=1 -C bin))
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GIGACHAT_CREDENTIALS
        sync: false
      - key: GIGACHAT_MODEL
        value: GigaChat-2
      - key: GIGACHAT_VERIFY_SSL_CERTS
        value: "true"
      - key: ADMIN_IDS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: 3.12.0
    # На free-тайре persistent disks не поддерживаются.
    # Файловая система эфемерна: данные БД и learning_errors.json
    # потеряются при редеплое или рестарте — для демо приемлемо.
